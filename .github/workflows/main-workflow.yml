permissions:
  contents: read
  actions: write
name: main-workflow

on:
  push:
    branches: [ main, develop, 'sprint/**', 'release/**', 'topic/RDK*' ]
  pull_request:
    branches: [ main, develop, 'sprint/**', 'release/**', 'topic/RDK*' ]

jobs:
  trigger-L1:
    uses: ./.github/workflows/L1-tests.yml

  coverage-gate:
    name: Coverage Gate
    needs: [trigger-L1]
    runs-on: ubuntu-latest
    # Transient runner/action failures must not block
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch baseline from build-metadata branch
        # Gracefully handle a missing build-metadata branch (first-time setup)
        continue-on-error: true
        run: |
          set -euo pipefail
          if git fetch origin build-metadata 2>/dev/null; then
            if git cat-file -e FETCH_HEAD:coverage-baseline.json 2>/dev/null; then
              git show FETCH_HEAD:coverage-baseline.json > coverage-baseline.json
              echo "Loaded coverage-baseline.json from build-metadata branch"
            else
              echo "build-metadata branch exists but coverage-baseline.json not found — skipping baseline comparison"
              echo "{}" > coverage-baseline.json
            fi
          else
            echo "build-metadata branch not found — absolute threshold check only (first-time setup)"
            echo "{}" > coverage-baseline.json
          fi

      - name: Download L1 coverage artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: artifacts-L1
          path: ./l1-coverage

      - name: Compare coverage to baseline
        continue-on-error: false
        run: |
          python3 .github/scripts/compare_coverage.py \
            --baseline coverage-baseline.json \
            --l1 ./l1-coverage/filtered_coverage.info

  update-baseline:
    name: Update Coverage Baseline
    # Runs ONLY on a direct push to develop AND only when the L1 test suite
    # passes AND the coverage gate passes. No L0 suite exists in this repo.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.trigger-L1.result == 'success' &&
      needs.coverage-gate.result == 'success'
    needs: [trigger-L1, coverage-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Queue concurrent runs; do not cancel in-progress — each merge deserves a
    # baseline update and force-push is atomic so queuing is safe.
    concurrency:
      group: update-baseline-develop
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch existing baseline for comparison report
        # Best-effort — if the branch or file is absent we compare against nothing.
        continue-on-error: true
        run: |
          set -euo pipefail
          if git fetch origin build-metadata 2>/dev/null; then
            if git cat-file -e FETCH_HEAD:coverage-baseline.json 2>/dev/null; then
              git show FETCH_HEAD:coverage-baseline.json > old-baseline.json
              echo "Loaded existing baseline for comparison"
            else
              echo '{}' > old-baseline.json
            fi
          else
            echo '{}' > old-baseline.json
          fi

      - name: Download L1 coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-L1
          path: ./l1-coverage

      - name: Extract coverage and write new baseline
        id: extract
        run: |
          set -euo pipefail
          export TIMESTAMP="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Run gate check against old baseline (informational — shows delta).
          python3 .github/scripts/compare_coverage.py \
            --baseline old-baseline.json \
            --l1 ./l1-coverage/filtered_coverage.info

          # Write the new baseline JSON.
          # This repo has no L0 suite, so the baseline only tracks L1.
          # compare_coverage.py's --output-json flag requires both L0 and L1;
          # we write the file directly here to avoid that constraint.
          python3 << 'EOF'
          import sys, json, os
          sys.path.insert(0, '.github/scripts')
          import compare_coverage

          l1 = compare_coverage.parse_lcov_coverage('./l1-coverage/filtered_coverage.info')
          if l1 is None:
              print('ERROR: Could not parse L1 coverage data', file=sys.stderr)
              sys.exit(1)

          payload = {
              'L1': l1,
              'commit': os.environ.get('GITHUB_SHA', ''),
              'timestamp': os.environ.get('TIMESTAMP', ''),
          }
          with open('new-baseline.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2)
              fh.write('\n')
          print(f'New baseline written: L1={l1}%')
          EOF

          if [ ! -s new-baseline.json ]; then
            echo "Coverage extraction produced no output — skipping baseline update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New baseline to commit:"
            cat new-baseline.json
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated baseline to build-metadata
        if: steps.extract.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Check out the build-metadata branch, or create it as an orphan.
          if git fetch origin build-metadata 2>/dev/null; then
            git checkout -B build-metadata FETCH_HEAD
          else
            git checkout --orphan build-metadata
            git rm -rf . --quiet 2>/dev/null || true
          fi

          cp -f new-baseline.json coverage-baseline.json

          git add coverage-baseline.json

          # Only commit when there is an actual change.
          if git diff --cached --quiet; then
            echo "Coverage baseline unchanged — no commit needed"
          else
            MSG=$(printf \
              'Update coverage baseline after develop merge [skip ci]\n\nCommit : %s\nRun ID : %s' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID")
            git commit -m "$MSG"
            git push --force-with-lease origin build-metadata
            echo "Pushed updated baseline to build-metadata"
          fi
